<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Menú principal – Huácar Stay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark light; }
    body { font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
  </style>
</head>
<body class="bg-neutral-50 text-neutral-900">
  <!-- Barra superior tipo promo con cuenta regresiva -->
  <div class="bg-purple-700 text-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2 flex items-center gap-3">
      <div class="hidden sm:flex items-center gap-2 text-sm opacity-90">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18"/><path d="M7 3v4"/><path d="M17 3v4"/><rect x="3" y="5" width="18" height="16" rx="2"/></svg>
        <span>Cuenta regresiva</span>
      </div>
      <div class="text-sm font-medium">
        <span id="countdownLabel">--d --h --m --s</span> para el 28 de setiembre de <span id="countdownYear"></span>
      </div>
      <!-- Enlace directo a Cuartos en NUEVA PESTAÑA -->
      <!-- Enlace directo a Cuartos en la misma pestaña -->
      <!-- Cambia href="cuartos.html" por la ruta real de tu página de cuartos -->
      <a href="cuartos.html" class="ml-auto inline-flex items-center px-3 py-1.5 rounded-full bg-white text-purple-700 text-sm font-semibold hover:bg-neutral-100">Cuartos</a>
    </div>
  </div>

  <!-- Header con menú principal -->
  <header class="bg-white border-b border-neutral-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center gap-4">
      <button class="p-2 rounded-md hover:bg-neutral-100" aria-label="Menú">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
      <a href="#" class="flex items-center gap-2 font-bold text-xl tracking-tight">
        <span class="inline-block w-7 h-7 rounded-md bg-rose-500"></span>
        Huácar Stay
      </a>

      <nav class="hidden md:flex items-center gap-6 ml-6 text-sm">
        <a href="#inicio" class="font-semibold">Inicio</a>
        
        <!-- Abrir cuartos en la misma pestaña -->
        <a href="cuartos.html" class="text-neutral-700 hover:text-neutral-900">Cuartos</a>
        <a href="#promociones" class="text-neutral-700 hover:text-neutral-900">Promociones</a>
        <a href="#contacto" class="text-neutral-700 hover:text-neutral-900">Contacto</a>
      </nav>

      <div class="ml-auto flex items-center gap-2">
        <button class="hidden sm:inline-flex px-4 py-2 rounded-full border border-neutral-300 hover:bg-neutral-50 text-sm">Conviértete en anfitrión</button>
        <button class="p-2 rounded-full hover:bg-neutral-100" aria-label="Idioma">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20"></path><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
        </button>
        <button class="p-2 rounded-full hover:bg-neutral-100" aria-label="Perfil">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 1 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
      </div>
    </div>

    <!-- Barra de búsqueda grande tipo Real Plaza -->
    <div class="border-t border-neutral-200 py-3">
      <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
        <form class="relative">
          <input type="text" placeholder="Encuentra de todo: Productos, Tiendas y Eve" class="w-full rounded-full border border-neutral-300 py-3 pl-5 pr-12 focus:outline-none focus:ring-2 focus:ring-neutral-800" />
          <button type="submit" class="absolute right-1 top-1 h-10 w-10 rounded-full bg-neutral-900 text-white grid place-items-center hover:bg-neutral-800" aria-label="Buscar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
          </button>
        </form>
      </div>

  <!-- Hero de portada (decorativo) -->
  <section id="inicio" class="relative">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div class="rounded-2xl overflow-hidden bg-neutral-200">
        <img src="https://images.unsplash.com/photo-1500048993953-d23a436266cf?q=80&w=1600&auto=format&fit=crop" alt="Viajes y experiencias" class="w-full h-[320px] object-cover">
      </div>
    </div>
  </section>

  <!-- Secciones ancla -->
  <section id="promociones" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <h2 class="text-xl font-semibold mb-3">Promociones</h2>
    <p class="text-neutral-600">Agrega aquí tus banners o cards de ofertas.</p>
  </section>

  <section id="contacto" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <h2 class="text-xl font-semibold mb-3">Contacto</h2>
    <p class="text-neutral-600">WhatsApp: <a class="text-rose-600 hover:underline" href="https://wa.me/51999999999" target="_blank" rel="noopener">+51 999 999 999</a> · Telegram: <a class="text-rose-600 hover:underline" href="#" target="_blank" rel="noopener">@tu_canal</a></p>
  </section>

  <footer class="border-t border-neutral-200 py-8 mt-8">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-sm text-neutral-600 flex flex-col md:flex-row gap-4 md:items-center md:justify-between">
      <p>© <span id="year"></span> Huácar Stay</p>
      <div class="flex gap-4">
        <a href="#" class="hover:text-neutral-900">Privacidad</a>
        <a href="#" class="hover:text-neutral-900">Términos</a>
      </div>
    </div>
  </footer>

  <script>
    // Año dinámico
    document.getElementById('year').textContent = new Date().getFullYear();

    // Cuenta regresiva al 28 de setiembre del OTRO año
    (function () {
      const label = document.getElementById('countdownLabel');
      const yearEl = document.getElementById('countdownYear');
      const now = new Date();
      const targetYear = now.getFullYear() + 1; // del otro año
      if (yearEl) yearEl.textContent = targetYear;
      const target = new Date(`${targetYear}-09-28T00:00:00`);

      function update() {
        const t = target - new Date();
        if (t <= 0) { label.textContent = '¡Llegó el día!'; clearInterval(timer); return; }
        const d = Math.floor(t / (1000*60*60*24));
        const h = Math.floor((t / (1000*60*60)) % 24);
        const m = Math.floor((t / (1000*60)) % 60);
        const s = Math.floor((t / 1000) % 60);
        label.textContent = `${d}d ${h}h ${m}m ${s}s`;
      }
      update();
      const timer = setInterval(update, 1000);
    })();
  </script>
</body>
</html>
